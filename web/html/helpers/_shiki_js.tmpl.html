<script type="module">
    // be sure to specify the exact version
    import { codeToHtml } from 'https://esm.sh/shiki@3.0.0'
    // or
    // import { codeToHtml } from 'https://esm.run/shiki@3.0.0'

    // HTML entity decoding (same as before)
    const htmlEscapes = new Map([
        ['&amp;', '&'],
        ['&lt;', '<'],
        ['&gt;', '>'],
    ])

    function unescapeHTMLEntities(str) {
        for (const [escaped, unescaped] of htmlEscapes) {
            str = str.replaceAll(escaped, unescaped)
        }
        return str
    }

    // Shiki 3.0 API uses `themes` instead of `themes.dark/light`
    const THEME_DARK = 'plastic'
    const THEME_LIGHT = 'plastic'

    // Loop through all <pre><code> blocks
    await Promise.all(
        Array.from(document.querySelectorAll('pre code')).map(async (codeBlock) => {
            const classNames = codeBlock.getAttribute('class')
            if (!classNames) return

            // Extract language from class like "language-js"
            let language = null
            for (const className of classNames.split(' ')) {
                const [token, ...rest] = className.split('-')
                if (token === 'language') {
                    language = rest.join('-')
                    break
                }
            }

            if (!language) return

            const code = unescapeHTMLEntities(codeBlock.innerHTML)

            // Shiki 3 adds only <pre><code> too, so same replacement pattern works
            const html = await codeToHtml(code, {
                lang: language,
                themes: {
                    light: THEME_LIGHT,
                    dark: THEME_DARK
                }
            })

            codeBlock.parentElement.outerHTML = html
        })
    )
</script>
